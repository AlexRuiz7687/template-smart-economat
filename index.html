<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Acceso - Smart Economato</title>
    <link rel="stylesheet" href="./assets/css/form-styles.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/header-style.css" />
    <script type="module" src="src/controllers/loginController.js"></script>
    <script type="module" src="src/controllers/registerController.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <header>
      <div class="cabecera">
        <h1 class="sr-only">Portal de Acceso - Smart Economato</h1>
        <div class="logos-externos">
          <img
            src="./assets/img/logo_gobcan_05-01_color_mod31.png"
            alt="Gobierno de Canarias"
            class="logo-gobierno consejeria"
          />
          <img
            src="./assets/img/logo-cifp-virgen-candelaria.png"
            alt="Logo Virgen de la Candelaria"
            class="logo-gobierno"
          />
        </div>
        <img
          src="./assets/img/logo-smart.png"
          alt="Logotipo Smart Economato"
          class="logo-smart-cabecera"
        />
      </div>
    </header>

    <main class="main-login">
      <div class="form-inicio">
        <h2>Inicio de sesión</h2>
        <form id="loginForm">
          <div class="cont-submit">
            <label for="nombreUsuario" class="sr-only">Nombre de usuario</label>
            <input
              type="text"
              id="nombreUsuario"
              class="inputSesion nombreUsuario"
              value=""
              placeholder="Nombre de usuario"
              autocomplete="username"
            />
          </div>

          <div class="cont-submit contenedor-password">
            <label for="form-pasword" class="sr-only">Contraseña</label>
            <input
              type="password"
              id="form-pasword"
              class="inputSesion form-pasword"
              value=""
              placeholder="Contraseña"
              autocomplete="current-password"
            />

            <button
              type="button"
              id="btnTogglePassword"
              class="ojo-password"
              aria-label="Mostrar u ocultar contraseña"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icono-ojo"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <p id="form-message" class="error" role="alert"></p>

          <div class="cont-submit"></div>

          <div class="cont-submit">
            <button id="submit" type="submit" class="btn-submit">
              Ingresar
            </button>
          </div>

          <a href="#" class="link-legal">Recuperar contraseña</a>
        </form>
      </div>

      <div class="form-inicio">
        <h2>Nuevo Usuario</h2>
        <form action="" id="newUserForm">
          <div class="cont-submit">
            <label for="newNombre" class="sr-only">Nombre</label>
            <input
              type="text"
              id="newNombre"
              class="inputSesion nombreUsuario"
              value=""
              placeholder="Nombre"
              autocomplete="given-name"
            />
          </div>
          <div class="cont-submit">
            <label for="newApellidos" class="sr-only">Apellidos</label>
            <input
              type="text"
              id="newApellidos"
              class="inputSesion nombreUsuario"
              value=""
              placeholder="Apellidos"
              autocomplete="family-name"
            />
          </div>

          <div class="cont-submit contenedor-password">
            <label for="newPassword" class="sr-only">Contraseña</label>
            <input
              type="password"
              id="newPassword"
              class="inputSesion form-pasword"
              value=""
              placeholder="Contraseña"
              autocomplete="new-password"
            />

            <button
              type="button"
              id="btnToggleNewPass"
              class="ojo-password"
              aria-label="Mostrar u ocultar contraseña"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icono-ojo"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="cont-submit contenedor-password">
            <label for="confirmPassword" class="sr-only"
              >Confirmar contraseña</label
            >
            <input
              type="password"
              id="confirmPassword"
              class="inputSesion form-pasword"
              value=""
              placeholder="Confirmar contraseña"
              autocomplete="new-password"
            />

            <button
              type="button"
              id="btnToggleConfirmPass"
              class="ojo-password"
              aria-label="Mostrar u ocultar contraseña"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icono-ojo"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <p id="newMail-message" class="error success" role="alert"></p>

          <div class="cont-submit">
            <label for="newEmail" class="sr-only">Correo Electrónico</label>
            <input
              type="email"
              id="newEmail"
              class="inputSesion nombreUsuario"
              value=""
              placeholder="Correo Electrónico"
              autocomplete="email"
            />
          </div>

          <div class="cont-submit">
            <label for="newTelefono" class="sr-only">Teléfono</label>
            <input
              type="tel"
              id="newTelefono"
              class="inputSesion nombreUsuario"
              value=""
              placeholder="Teléfono"
              autocomplete="tel"
            />
          </div>

          <div class="cont-submit select-rol">
            <label for="tipoUsuario">Rol de usuario</label>
            <select name="rol" id="tipoUsuario">
              <option value="profesor">Profesor</option>
              <option value="alumno">Alumno</option>
            </select>
          </div>

          <p id="register-message" class="error" role="alert"></p>
          <div class="cont-submit"></div>

          <div class="cont-submit checkbox-container">
            <input
              type="checkbox"
              id="consentimientoRegistro"
              name="consentimiento"
              value="consentimiento"
              aria-label="He leído y acepto la política de privacidad"
              onchange="
                document.getElementById('register').disabled = !this.checked
              "
            />

            <label for="consentimientoRegistro">
              He leído y acepto la
              <a
                href="/politica-de-privacidad/"
                target="_blank"
                class="link-legal"
                >política de privacidad</a
              >
            </label>
          </div>

          <div class="cont-submit">
            <button id="register" type="submit" class="btn-submit" disabled>
              Registrar
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer aria-label="Información legal">
      <div class="footer-content">
        <a href="#" class="link-legal">Términos legales</a>

        <span aria-hidden="true"> | </span>

        <span>Versión 1.0</span>

        <span aria-hidden="true"> | </span>

        <span>Alexis Ruiz Salazar</span>
      </div>
    </footer>
  </body>
</html>
