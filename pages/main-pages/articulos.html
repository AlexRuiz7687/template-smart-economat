<h2 class="sr-only">Sección: Artículos</h2>
<!-- Contenedor Artículosn-->
<div class="menu-articulos"></div>
<!-- Tab links -->
<div class="tab">
  <button class="tablinks" id="defaultOpen" data-target="verArticulos">Artículos</button>
  <button class="tablinks" id="btnNuevoArticulo" data-target="nvoArticulo">Nuevo Artículo</button>
  <!-- <button class="tablinks" id="btnCargaMasiva" data-target="cargaMasiva">Carga Masiva</button> -->

</div>

</div>
<!-- Tab content -->
<div id="nvoArticulo" class="tabcontent">
  <div class="crear-articulo">
    <form class="form-nuevo-articulo">
      <div class="form-row main-inputs">
        <div class="form-group">
          <input type="text" id="codigo" class="form-control rounded" placeholder="Código (SKU)">
        </div>
        <div class="form-group">
          <input type="text" id="nombre" class="form-control rounded" placeholder="Nombre del producto *">
        </div>

        <div class="form-group">
          <select id="proveedor" class="form-control rounded option-style">
            <option value="">-- Seleccionar Proveedor --</option>
          </select>
        </div>

        <div class="form-group">
          <input type="number" id="precio" class="form-control rounded" placeholder="Precio Coste *" step="0.01">
        </div>

        <div class="form-group">
          <select id="unidad" class="form-control rounded option-style">
            <option value="">Unidad medida</option>
            <option value="Unidad">Unidad</option>
            <option value="kg">kg</option>
            <option value="gr">gr</option>
            <option value="litro">litro</option>
          </select>
        </div>
      </div>

      <div class="form-row description-image-row">
        <div class="left-col">
          <div class="form-group">
            <textarea id="descripcion" rows="4" class="form-control rounded"
              placeholder="Descripción detallada"></textarea>
          </div>

          <div class="form-row" style="display: flex; gap: 10px; width: 100%;">

            <div class="form-group" style="flex: 2;">
              <select id="categoria" class="form-control rounded option-style" style="width: 100%;">
                <option value="">-- Seleccionar Categoría --</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1;">
              <input type="number" id="caducidad" class="form-control rounded" placeholder="Caducidad"
                style="width: 100%;">
            </div>

            <div class="form-group" style="flex: 1;">
              <input type="number" id="stockMinimo" class="form-control rounded" placeholder="Stock Mín."
                style="width: 100%;">
            </div>

          </div>

          <!-- <div class="form-group">
            <input type="text" id="imagenUrl" class="form-control rounded" placeholder="URL de la imagen (http://...)">
          </div> -->

          <div class="alergenos-section rounded" style="margin-top: 15px;">
            <label class="alergenos-label"
              style="font-weight: bold; display: block; margin-bottom: 10px;">Alérgenos</label>

            <div class="alergenos-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Gluten"> Gluten</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Crustaceos">
                Crustáceos</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Huevo"> Huevos</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Pescado"> Pescado</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Cacahuetes">
                Cacahuetes</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Soja"> Soja</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Lacteos"> Lácteos</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="FrutosCascara"> F.
                Cáscara</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Apio"> Apio</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Mostaza"> Mostaza</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Sesamo"> Sésamo</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Sulfitos">
                Sulfitos</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Altramuces">
                Altramuces</label>

              <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Moluscos">
                Moluscos</label>

              <!-- <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Maiz"> Maíz</label>
    
    <label class="radio-label"><input type="checkbox" class="alergeno-check" value="Cacao"> Cacao</label>
 -->
            </div>
          </div>
        </div>

        <div class="right-col image-upload-col">
          <div class="image-placeholder rounded" id="preview-img">Sin Imagen</div>

          <button id="btnRegistrarArticulo" class="btn-guardar registrarArticulo">
            Registrar Artículo
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="verArticulos" class="tabcontent">

  <div class="cabecera-articulos">

    <div class="controles">
      <input type="text" id="busqueda" placeholder="Buscar producto..." />
      <button id="btnBuscar">Buscar</button>

      <select id="categoriaSelect">
        <option value="">-- Categoría --</option>
      </select>

      <select id="ordenSelect">
        <option value="asc">Precio ascendente</option>
        <option value="desc">Precio descendente</option>
      </select>

      <!-- <button id="btnStock">Comprobar stock</button> -->
      <button id="btnAllProducts">Mostrar todos</button>
    </div>

  </div>

  <table id="tablaProductos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio (€)</th>
        <!-- <th>Stock</th> -->
        <th>Stock Mínimo</th>
        <th>Proveedor</th>
        <th>Detalle</th>
      </tr>
    </thead>
    <tbody id="tabla-body"></tbody>
    <tfoot>
      <tr>
        <td colspan="8" id="resumen"></td>
      </tr>
    </tfoot>
  </table>

</div>
