<div class="contenedor-seccion">
    
    <div class="header-flex">
        <div class="menu-articulos">
            <h2>Gestión de Pedidos</h2>
        </div>
        
        <div class="tab">
            <button class="tablinks active" id="tabListaPedidos">Historial</button>
            <button class="tablinks" id="tabNuevoPedido">Nuevo Pedido</button>
        </div>
    </div>

    <div id="vistaListaPedidos" class="tabcontent" style="display: block;">
        <div class="cabecera-articulos">
            <div class="controles">
                <input type="text" id="busquedaPedido" placeholder="Buscar por ID o Usuario..." class="form-control rounded" style="width: 250px;">
                
                <select id="filtroEstadoPedido" class="form-control rounded option-style">
                    <option value="">-- Todos los Estados --</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="aprobado">Aprobado</option>
                    <option value="recibido">Recibido</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
        </div>

        <div class="contenedor-tabla-responsive">
            <table class="styled-table" style="width: 100%;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Solicitante</th>
                        <th>Estado</th>
                        <th>Total (€)</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos-body">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="vistaNuevoPedido" class="tabcontent" style="display: none;">
        
        <div class="hoja-pedido-container">
            <h2 class="titulo-hoja" style="border-bottom: 2px solid #333; margin-bottom:20px; padding-bottom:10px;">HOJA DE PEDIDO</h2>

            <form id="formNuevoPedido">
                <div class="grid-cabecera-pedido">
                    
                    <div class="fila-hoja">
                        <label>PROFESOR/A:</label>
                        <input type="text" id="nombreProfesor" class="input-hoja" readonly style="background-color: #f0f0f0; color: #555;">
                        <input type="hidden" id="idUsuarioPedido">
                    </div>

                    <div class="fila-hoja fechas-group">
                        <div class="campo-fecha">
                            <label>FECHA PEDIDO:</label>
                            <input type="date" id="fechaPedido" class="input-hoja" required>
                        </div>
                        <div class="campo-fecha">
                            <label>FECHA ENTREGA:</label>
                            <input type="date" id="fechaEntrega" class="input-hoja" required>
                        </div>
                    </div>
                </div>

                <div class="contenedor-tabla-pedido" style="margin-top: 20px;">
                    <table class="tabla-hoja" id="tablaLineasPedido">
                        <thead>
